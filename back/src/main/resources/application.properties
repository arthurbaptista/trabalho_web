# Configuracao do banco (SE NO SEU PC FOR DIFERENTE TEM QUE MUDAR!!!!)

spring.application.name=trabalho-web

# Configuracao do Servidor
server.port=8080

# Banco de Dados
spring.datasource.url=jdbc:postgresql://localhost:5432/manutencao_db
spring.datasource.username=postgres
spring.datasource.password=Holanda.19

# JPA e Hibernate (Criacao automatica das tabelas)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Logs do SQL no terminal
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
