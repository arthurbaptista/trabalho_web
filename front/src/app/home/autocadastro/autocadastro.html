<main class="cadastro-page">

    <!-- ============================================================ -->
    <!-- Estrutura principal da página de cadastro                    -->
    <!-- ============================================================ -->
    <!-- A página é dividida em duas áreas principais:               -->
    <!-- painel de cadastro e painel visual.                          -->
    <!-- ============================================================ -->

    <!-- Painel responsável pelos campos e ações do cadastro.        -->
    <!-- Mantém os elementos relacionados à criação da conta.        -->
    <section class="cadastro-panel">

      <!-- Container utilizado para organizar o conteúdo.            -->
      <!-- Centraliza visualmente os elementos do formulário.         -->
      <div class="cadastro-content">

        <!-- Identificação visual da aplicação.                      -->
        <!-- O componente de logo é reutilizado em outras telas.     -->
        <div class="cadastro-logo">

          <!-- Componente responsável pela apresentação da marca.    -->
          <app-logo />

        </div>

        <!-- ======================================================== -->
        <!-- Título da área de cadastro                              -->
        <!-- ======================================================== -->
        <!-- O título apresenta ao usuário a finalidade da tela.     -->
        <!-- O ponto possui uma classe própria para estilização.     -->
        <!-- ======================================================== -->

        <h1>Crie sua conta<span class="cadastro-dot">.</span></h1>

        <!-- ======================================================== -->
        <!-- Formulário de criação de usuário                        -->
        <!-- ======================================================== -->
        <!-- O evento ngSubmit centraliza o envio das informações.   -->
        <!-- A validação visual dos campos é mantida pelo formulário. -->
        <!-- novalidate permite que a aplicação controle o fluxo.    -->
        <!-- ======================================================== -->

        <form (ngSubmit)="onSubmit()" novalidate>

          <!-- ====================================================== -->
          <!-- Campo de identificação do usuário                     -->
          <!-- ====================================================== -->
          <!-- O nome completo é utilizado como informação principal. -->
          <!-- O autocomplete facilita o preenchimento pelo navegador. -->
          <!-- ====================================================== -->

          <div class="field">

            <!-- Identificação textual do campo.                     -->
            <label for="nome">Nome completo<span class="required" aria-hidden="true">*</span></label>

            <div class="control">

              <!-- Entrada destinada ao nome completo.               -->
              <!-- O valor é sincronizado com a propriedade nome.    -->
              <input
                id="nome"
                name="nome"
                type="text"
                [(ngModel)]="nome"
                autocomplete="name"
                required
              />

            </div>
          </div>

          <!-- ====================================================== -->
          <!-- Dados de contato e identificação                      -->
          <!-- ====================================================== -->
          <!-- CPF e telefone permanecem agrupados para facilitar     -->
          <!-- a organização visual dos dados pessoais.              -->
          <!-- ====================================================== -->

          <div class="field-row">

            <!-- Campo destinado ao CPF do usuário.                  -->
            <div class="field">

              <label for="cpf">CPF<span class="required" aria-hidden="true">*</span></label>

              <div class="control">

                <!-- A alteração do CPF é tratada pelo componente.  -->
                <!-- Isso permite aplicar a formatação apropriada.   -->
                <input
                  id="cpf"
                  name="cpf"
                  type="text"
                  inputmode="numeric"
                  maxlength="14"
                  placeholder="000.000.000-00"
                  [ngModel]="cpf"
                  (ngModelChange)="onCpfChange($event)"
                  autocomplete="off"
                  required
                />

              </div>
            </div>

            <!-- Campo destinado ao telefone de contato.             -->
            <div class="field">

              <label for="telefone">Telefone<span class="required" aria-hidden="true">*</span></label>

              <div class="control">

                <!-- O evento de alteração permite formatar o valor. -->
                <input
                  id="telefone"
                  name="telefone"
                  type="text"
                  inputmode="numeric"
                  maxlength="15"
                  placeholder="(00) 00000-0000"
                  [ngModel]="telefone"
                  (ngModelChange)="onTelefoneChange($event)"
                  autocomplete="tel"
                  required
                />

              </div>
            </div>
          </div>

          <!-- ====================================================== -->
          <!-- Informações de acesso                                  -->
          <!-- ====================================================== -->
          <!-- O endereço de e-mail representa o principal dado de   -->
          <!-- contato eletrônico utilizado durante o cadastro.      -->
          <!-- ====================================================== -->

          <div class="field">

            <label for="email">E-mail<span class="required" aria-hidden="true">*</span></label>

            <div class="control">

              <!-- Campo com tipo email para auxiliar a validação.   -->
              <input
                id="email"
                name="email"
                type="email"
                [(ngModel)]="email"
                autocomplete="email"
                required
              />

            </div>
          </div>

          <!-- ====================================================== -->
          <!-- Informações de endereço                               -->
          <!-- ====================================================== -->
          <!-- O CEP pode ser utilizado para localizar informações   -->
          <!-- complementares do endereço informado pelo usuário.    -->
          <!-- ====================================================== -->

          <div class="field-row field-row--cep">

            <div class="field">

              <label for="cep">CEP<span class="required" aria-hidden="true">*</span></label>

              <div class="control">

                <!-- O CEP possui tratamento específico no componente. -->
                <input
                  id="cep"
                  name="cep"
                  type="text"
                  inputmode="numeric"
                  maxlength="9"
                  placeholder="00000-000"
                  [ngModel]="cep"
                  (ngModelChange)="onCepChange($event)"
                  (blur)="buscarCep()"
                  autocomplete="off"
                  required
                />

                <!-- Indicador visual apresentado durante a busca. -->
                @if (buscandoCep()) {
                  <span class="control-spinner" aria-hidden="true"></span>
                }

              </div>
            </div>

            <!-- Número do endereço permanece independente do CEP. -->
            <div class="field">

              <label for="numero">Número<span class="required" aria-hidden="true">*</span></label>

              <div class="control">

                <input
                  id="numero"
                  name="numero"
                  type="text"
                  [(ngModel)]="numero"
                  autocomplete="off"
                  required
                />

              </div>
            </div>
          </div>

          <!-- ====================================================== -->
          <!-- Endereço principal                                     -->
          <!-- ====================================================== -->
          <!-- O logradouro recebe a informação principal do endereço -->
          <!-- residencial ou comercial informado pelo usuário.      -->
          <!-- ====================================================== -->

          <div class="field">

            <label for="logradouro">Endereço<span class="required" aria-hidden="true">*</span></label>

            <div class="control">

              <input
                id="logradouro"
                name="logradouro"
                type="text"
                [(ngModel)]="logradouro"
                autocomplete="address-line1"
                required
              />

            </div>
          </div>

          <!-- ====================================================== -->
          <!-- Complemento e bairro                                  -->
          <!-- ====================================================== -->
          <!-- O complemento é opcional, enquanto o bairro faz parte -->
          <!-- das informações obrigatórias do endereço.             -->
          <!-- ====================================================== -->

          <div class="field-row">

            <div class="field">

              <label for="complemento">Complemento</label>

              <div class="control">

                <input
                  id="complemento"
                  name="complemento"
                  type="text"
                  [(ngModel)]="complemento"
                  autocomplete="address-line2"
                />

              </div>
            </div>

            <div class="field">

              <label for="bairro">Bairro<span class="required" aria-hidden="true">*</span></label>

              <div class="control">

                <input
                  id="bairro"
                  name="bairro"
                  type="text"
                  [(ngModel)]="bairro"
                  autocomplete="off"
                  required
                />

              </div>
            </div>
          </div>

          <!-- ====================================================== -->
          <!-- Localização geográfica                                -->
          <!-- ====================================================== -->
          <!-- Cidade e UF complementam os dados de localização do   -->
          <!-- usuário e são apresentados em conjunto.               -->
          <!-- ====================================================== -->

          <div class="field-row field-row--cidade">

            <div class="field">

              <label for="cidade">Cidade<span class="required" aria-hidden="true">*</span></label>

              <div class="control">

                <input
                  id="cidade"
                  name="cidade"
                  type="text"
                  [(ngModel)]="cidade"
                  autocomplete="address-level2"
                  required
                />

              </div>
            </div>

            <div class="field">

              <label for="estado">UF<span class="required" aria-hidden="true">*</span></label>

              <div class="control control--select">

                <!-- Lista de estados fornecida pelo componente.    -->
                <select
                  id="estado"
                  name="estado"
                  [(ngModel)]="estado"
                  autocomplete="address-level1"
                  required
                >
                  <option value="" disabled selected>--</option>

                  @for (uf of estados; track uf) {
                    <option [value]="uf">{{ uf }}</option>
                  }

                </select>

              </div>
            </div>
          </div>

          <!-- ====================================================== -->
          <!-- Área de mensagens do cadastro                         -->
          <!-- ====================================================== -->
          <!-- Mensagens de erro e sucesso são controladas pelo     -->
          <!-- estado atual do componente Angular.                  -->
          <!-- ====================================================== -->

          @if (erro()) {
            <p class="cadastro-error" role="alert">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 7.5v5M12 16h.01"/>
              </svg>
              {{ erro() }}
            </p>
          }

          <!-- Feedback apresentado quando o cadastro é concluído. -->
          @if (sucesso()) {
            <p class="cadastro-success" role="status">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m5 13 4 4L19 7"/>
              </svg>
              {{ sucesso() }}
            </p>
          }

          <!-- ====================================================== -->
          <!-- Ação principal do formulário                          -->
          <!-- ====================================================== -->
          <!-- O botão é desabilitado durante o processamento para   -->
          <!-- evitar submissões simultâneas.                        -->
          <!-- ====================================================== -->

          <button type="submit" class="cadastro-submit" [disabled]="carregando()">

            <!-- Indicador exibido durante o processamento.         -->
            @if (carregando()) {
              <span class="spinner" aria-hidden="true"></span>
              Criando conta...
            } @else {
              Criar conta
            }

          </button>

        </form>

        <!-- Link para usuários que já possuem cadastro.            -->
        <a routerLink="/login" class="cadastro-register">Já tenho uma conta</a>

      </div>
    </section>

    <!-- ============================================================ -->
    <!-- Área visual complementar                                    -->
    <!-- ============================================================ -->
    <!-- A imagem ocupa a área lateral e complementa a identidade    -->
    <!-- visual da tela de cadastro.                                  -->
    <!-- ============================================================ -->

    <aside class="cadastro-visual" aria-hidden="true">

      <!-- Imagem decorativa da tela de cadastro.                    -->
      <img src="login-side.jpg" alt="" />

    </aside>

  </main>
