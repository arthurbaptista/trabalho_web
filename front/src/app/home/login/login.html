<main class="login-page">
  <!-- Lado do formulário -->
  <section class="login-panel">
    <div class="login-content">
      <div class="login-logo">
        <app-logo />
      </div>

      <h1>Faça seu login<span class="login-dot">.</span></h1>

      <form (ngSubmit)="onSubmit()" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <div class="control">
            <input
              id="email"
              name="email"
              type="email"
              [(ngModel)]="email"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <div class="control">
            <input
              id="senha"
              name="senha"
              class="input--with-toggle"
              [type]="mostrarSenha() ? 'text' : 'password'"
              [(ngModel)]="senha"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="control-toggle"
              (click)="alternarSenha()"
              [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
              [attr.aria-pressed]="mostrarSenha()"
            >
              @if (mostrarSenha()) {
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path d="m4 20 16-16"/>
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              }
            </button>
          </div>
        </div>

        <label class="checkbox">
          <input type="checkbox" name="lembrar" [(ngModel)]="lembrar" />
          <span class="checkbox-box" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
          </span>
          Lembrar de mim
        </label>

        @if (erro()) {
          <p class="login-error" role="alert">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 7.5v5M12 16h.01"/>
            </svg>
            {{ erro() }}
          </p>
        }

        <button type="submit" class="login-submit" [disabled]="carregando()">
          @if (carregando()) {
            <span class="spinner" aria-hidden="true"></span>
            Entrando...
          } @else {
            Entrar
          }
        </button>
      </form>

      <a routerLink="/cadastro" class="login-register">Ainda não tenho uma conta</a>
    </div>
  </section>

  <!-- Lado da imagem -->
  <aside class="login-visual" aria-hidden="true">
    <img src="login-side.jpg" alt="" />
  </aside>
</main>
