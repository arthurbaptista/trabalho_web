<aside class="sidebar" aria-label="Navegação do funcionário">
  <a class="sidebar-logo" routerLink="/funcionario" aria-label="Início">
    <app-logo [compact]="true" />
  </a>

  <nav class="sidebar-nav">
    @if (pagina() === 'funcionario') {
      <button
        type="button"
        title="Solicitações abertas"
        aria-label="Solicitações abertas"
        [class.active]="vista() === 'abertas'"
        (click)="abertas.emit()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4.5 11.2 12 4.8l7.5 6.4"/>
          <path d="M6.5 10.5V19h11v-8.5"/>
        </svg>
      </button>
      <button
        type="button"
        title="Todas as solicitações"
        aria-label="Todas as solicitações"
        [class.active]="vista() === 'todas'"
        (click)="todas.emit()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 6h13M8 12h13M8 18h13"/>
          <path d="M3 6h.01M3 12h.01M3 18h.01"/>
        </svg>
      </button>
    } @else {
      <a routerLink="/funcionario" title="Solicitações abertas" aria-label="Solicitações abertas">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4.5 11.2 12 4.8l7.5 6.4"/>
          <path d="M6.5 10.5V19h11v-8.5"/>
        </svg>
      </a>
      <a
        routerLink="/funcionario"
        [queryParams]="{ vista: 'todas' }"
        title="Todas as solicitações"
        aria-label="Todas as solicitações"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 6h13M8 12h13M8 18h13"/>
          <path d="M3 6h.01M3 12h.01M3 18h.01"/>
        </svg>
      </a>
    }

    <a
      routerLink="/categorias"
      routerLinkActive="active"
      title="Categorias"
      aria-label="Categorias"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h10"/>
      </svg>
    </a>

    <a
      routerLink="/funcionarios"
      routerLinkActive="active"
      title="Funcionários"
      aria-label="Funcionários"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4z"/>
        <path d="M4 20a8 8 0 0 1 16 0"/>
      </svg>
    </a>

    <a
      routerLink="/relatorios/receitas"
      routerLinkActive="active"
      title="Relatório de receitas"
      aria-label="Relatório de receitas"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 3v4M17 3v4M4 9h16"/>
        <path d="M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>
        <path d="M8 14h3M13 17h3"/>
      </svg>
    </a>

    <a
      routerLink="/relatorios/receitas-categoria"
      routerLinkActive="active"
      title="Relatório de receitas por categoria"
      aria-label="Relatório de receitas por categoria"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>
      </svg>
    </a>
  </nav>

  <button type="button" class="sidebar-sair" title="Sair" (click)="sair.emit()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 7V5.8A1.8 1.8 0 0 1 10.8 4h7.4A1.8 1.8 0 0 1 20 5.8v12.4A1.8 1.8 0 0 1 18.2 20h-7.4A1.8 1.8 0 0 1 9 18.2V17"/>
      <path d="M13 12H4M7 9l-3 3 3 3"/>
    </svg>
  </button>
</aside>
